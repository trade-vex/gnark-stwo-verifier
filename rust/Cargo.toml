[package]
name = "stwo-gnark"
version = "0.1.0"
edition = "2021"
description = "Constraint generator for stwo proof verification in gnark"
license = "Apache-2.0"

[lib]
name = "stwo_gnark"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Stwo - same version as stwo-cairo (rev 45d0180)
stwo = { git = "https://github.com/starkware-libs/stwo", rev = "45d0180", optional = true, default-features = false, features = ["parallel", "prover"] }
stwo-constraint-framework = { git = "https://github.com/starkware-libs/stwo", rev = "45d0180", optional = true, default-features = false, features = ["parallel", "prover"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# FFI
libc = "0.2"

# Utilities
thiserror = "1.0"
hex = "0.4"
num-traits = "0.2"
rand = "0.8"
starknet-ff = { version = "0.3.7", optional = true }

[features]
default = ["stwo_support"]
stwo_support = ["stwo", "stwo-constraint-framework", "starknet-ff"]

[dev-dependencies]
rand = "0.8"

[[example]]
name = "proving_an_air"
required-features = ["stwo_support"]

[[example]]
name = "static_lookups"
required-features = ["stwo_support"]
